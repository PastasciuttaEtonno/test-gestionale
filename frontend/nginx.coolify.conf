# Config nginx per il deploy su Coolify.
#
# Serve SOLO la SPA: con due domini distinti e' Traefik a instradare
# api-gestionale.vasquezlisciotto.xyz verso core_service, quindi qui non
# serve nessun blocco proxy /api (a differenza di nginx.local.conf, che in
# locale supplisce all'assenza di Traefik).
#
# Rispetto a nginx.conf aggiunge gli header di sicurezza: erano definiti solo
# nel Caddyfile del percorso Aruba, e il percorso Coolify li perdeva. E' il
# punto M3 di SECURITY-AUDIT-2026-06-10.md.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

# Config nginx SOLO per docker-compose locale.
# In produzione e' Traefik (Coolify) a instradare /api e /health verso
# core_service: l'immagine usa frontend/nginx.conf (solo SPA), questo file
# viene montato come volume unicamente dal docker-compose.yml di sviluppo.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE event stream: no buffering, connessione long-lived.
    location /api/v1/events/stream {
        proxy_pass http://core_service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://core_service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://core_service:8000;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

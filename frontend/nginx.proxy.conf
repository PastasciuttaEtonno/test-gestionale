# Config nginx per il deploy su Coolify.
#
# Il container client e' l'unico servizio con un dominio pubblico: Traefik gli
# manda tutto il traffico di gestionale.vasquezlisciotto.xyz e nginx smista
# internamente /api e /health verso core_service. Fare il routing qui invece
# che con label Traefik per-path evita il middleware stripprefix, che
# toglierebbe /api dall'URL e romperebbe FastAPI (che serve su /api/v1).
#
# E' lo stesso schema di nginx.local.conf, cosi' locale e produzione si
# comportano allo stesso modo.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE event stream: no buffering, connessione long-lived.
    location /api/v1/events/stream {
        proxy_pass http://core_service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://core_service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://core_service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gli stessi header che il Caddyfile applicava sul deploy Aruba. Traefik
    # termina il TLS ma non li aggiunge, quindi vanno messi qui.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

name: Deploy Backend Aruba

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
  workflow_dispatch:

concurrency:
  group: deploy-backend-aruba
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check app alembic

      - name: Format check
        run: uv run ruff format --check app alembic

      - name: Importability check
        run: uv run python -m compileall app alembic

      - name: Tests
        run: uv run python -m pytest

  deploy:
    runs-on: ubuntu-24.04
    needs: quality
    permissions:
      contents: read

    steps:
      - name: Validate Coolify config
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_DEPLOY_WEBHOOK}" ]; then
            echo "::error::GitHub secret mancante: COOLIFY_DEPLOY_WEBHOOK"
            exit 1
          fi

      - name: Trigger Coolify deploy
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
        run: |
          set -euo pipefail
          response=$(curl -fsS -X GET "${COOLIFY_DEPLOY_WEBHOOK}")
          echo "Risposta Coolify: ${response}"

name: Publish Backend Image

on:
  workflow_run:
    workflows: ["Checks"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  publish-backend-image:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve source ref
        id: source-ref
        run: |
          if [ -n "${CHECKS_HEAD_SHA}" ]; then
            echo "git_ref=${CHECKS_HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          else
            echo "git_ref=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          fi
        env:
          CHECKS_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source-ref.outputs.git_ref }}

      - name: Derive image name
        id: image-name
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="$(echo "${GITHUB_EVENT_REPOSITORY_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${repo}-backend" >> "${GITHUB_OUTPUT}"
        env:
          GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-name.outputs.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

# Deploy su Coolify — due domini, come da planning/docs/backend/13-coolify-deploy-setup.md
#
#   gestionale.vasquezlisciotto.xyz      -> client        (SPA, nginx :80)
#   api-gestionale.vasquezlisciotto.xyz  -> core_service  (FastAPI :8000)
#
# Il trattino in "api-gestionale" non e' estetico: Cloudflare Universal SSL
# copre solo i sottodomini di primo livello, quindi api.gestionale.* resterebbe
# senza certificato (planning/docs/project-state/current-state.md:263).
#
# Differenze rispetto a docker-compose.yml (sviluppo):
#
#   - nessun servizio pubblica porte sull'host. db_service e redis_service
#     restano raggiungibili solo sulla rete interna del progetto.
#   - core_service usa Dockerfile.coolify, che lancia `alembic upgrade head`
#     prima di uvicorn: non serve un servizio db_migrator separato.
#   - il frontend builda con VITE_API_BASE_URL assoluto: con l'API su un
#     dominio diverso il default relativo non troverebbe nulla.
#
# I domini vanno assegnati ai due servizi dal pannello Coolify. Le variabili
# senza default vanno impostate nella UI: senza POSTGRES_PASSWORD il container
# Postgres non parte, e core_service resta unhealthy a catena.
#
# Le variabili non elencate qui usano i default di app/core/config.py, che gia'
# puntano agli hostname interni corretti (redis_service e simili).

services:
  client:
    build:
      context: ./frontend
      dockerfile: Dockerfile.coolify
      args:
        VITE_API_BASE_URL: https://api-gestionale.vasquezlisciotto.xyz/api/v1
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_CLIENT=/
    depends_on:
      core_service:
        condition: service_healthy

  core_service:
    build:
      context: ./backend
      dockerfile: Dockerfile.coolify
    restart: unless-stopped
    environment:
      SERVICE_FQDN_CORESERVICE: /
      APP_ENV: production
      DEMO_READONLY: ${DEMO_READONLY:-true}
      LOG_JSON: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db_service:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      CORS_ALLOWED_ORIGINS: '["https://gestionale.vasquezlisciotto.xyz"]'
      AUTH_ALLOWED_ORIGINS: '["https://gestionale.vasquezlisciotto.xyz"]'
      AUTH_ENFORCE_ORIGIN_CHECK: "true"
      REFRESH_COOKIE_SECURE: "true"
      # I due host condividono il dominio registrabile vasquezlisciotto.xyz,
      # quindi per il browser sono same-site: lax basta perche' il cookie di
      # refresh viaggi da gestionale.* verso api-gestionale.*.
      REFRESH_COOKIE_SAMESITE: lax
      # Volutamente vuoto. build_security_request_context() si fida di
      # X-Forwarded-For solo se il peer diretto e' in questa lista, e confronta
      # per uguaglianza esatta: non gestisce le CIDR. Dietro Traefik il peer e'
      # un IP di container che cambia a ogni deploy, quindi nessun valore qui
      # e' stabile e i range Cloudflare non verrebbero comunque mai confrontati.
      # Finche' il codice non legge CF-Connecting-IP (punto M2 dell'audit) il
      # lockout per-IP resta di fatto globale: accettabile per una demo, ma
      # meglio saperlo che avere una lista che sembra funzionare e non lo fa.
      TRUSTED_PROXY_IPS: "[]"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      db_service:
        condition: service_healthy
      redis_service:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      APP_ENV: production
      DEMO_READONLY: ${DEMO_READONLY:-true}
      LOG_JSON: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db_service:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      AUTH_ENFORCE_ORIGIN_CHECK: "true"
      REFRESH_COOKIE_SECURE: "true"
    depends_on:
      db_service:
        condition: service_healthy
      redis_service:
        condition: service_healthy

  db_service:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis_service:
    image: redis:8.2.6-alpine3.22
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

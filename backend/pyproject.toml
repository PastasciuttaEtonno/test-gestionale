[project]
name = "Gestionale-core-service"
version = "0.1.0"
description = "FastAPI backend skeleton for Gestionale modular monolith."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4,<2.0.0",
    "celery[redis]>=5.5.3,<6.0.0",
    "cryptography>=46.0.3,<47.0.0",
    "fastapi>=0.136.1,<1.0.0",
    "pyjwt>=2.12.1,<3.0.0",
    "pydantic-settings>=2.14.1,<3.0.0",
    "pwdlib[argon2]>=0.3.0,<1.0.0",
    "sqlalchemy>=2.0.49,<3.0.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "uvicorn[standard]>=0.47.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0.0",
    "pytest>=8.4.2,<9.0.0",
    "ruff>=0.14.2,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

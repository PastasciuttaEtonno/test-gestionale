services:
  client:
    build:
      context: ./frontend
    container_name: Gestionale_client
    ports:
      - "5173:80"
    env_file:
      - ./frontend/.env.example
    volumes:
      # Solo locale: instrada /api e /health verso core_service (in produzione
      # lo fa Traefik su Coolify, l'immagine usa frontend/nginx.conf pristino).
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      core_service:
        condition: service_healthy

  core_service:
    build:
      context: ./backend
    container_name: Gestionale_core_service
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    depends_on:
      db_service:
        condition: service_healthy
      redis_service:
        condition: service_healthy
      db_migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready').read()"]
      interval: 15s
      timeout: 5s
      retries: 5

  db_migrator:
    build:
      context: ./backend
    container_name: Gestionale_db_migrator
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    restart: "no"
    env_file:
      - ./backend/.env.example
    depends_on:
      db_service:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
    container_name: Gestionale_celery_worker
    command: ["/app/.venv/bin/celery", "-A", "app.core.celery_app:celery_app", "worker", "--loglevel=info"]
    env_file:
      - ./backend/.env.example
    depends_on:
      db_service:
        condition: service_healthy
      redis_service:
        condition: service_healthy
      db_migrator:
        condition: service_completed_successfully

  db_service:
    image: postgres:17.10-alpine3.23
    container_name: Gestionale_db_service
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestionale}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-gestionale}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis_service:
    image: redis:8.2.6-alpine3.22
    container_name: Gestionale_redis_service
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
